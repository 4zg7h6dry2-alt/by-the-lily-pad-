<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Kitsuné Nook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;700&family=Pixelify+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- TOP NAV (built in step 2) -->
    <header class="topbar" id="topbar">
      <div class="brand">
        <!-- LOGO PLACEHOLDER: Kelly's 16-bit logo goes here -->
        <span class="placeholder-box" aria-hidden="true">logo</span>
        <h1 class="brand-name">The Kitsuné Nook</h1>
      </div>
      <nav class="nav" aria-label="Main">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#diary">Diary</a>
        <a class="nav-link" href="#about">About Me</a>
        <a class="nav-link" href="#contact">Contact Me</a>
      </nav>
      <!-- Resource search goes here later -->
    </header>

    <!-- LEFT SIDEBAR (mood card, later) -->
    <aside class="sidebar sidebar-left" id="left">
      <section class="card">
        <h2 class="card-title">Today's Mood</h2>
        <p class="card-note">Coming soon</p>
      </section>
    </aside>

    <!-- CENTRAL WORKSPACE (Kitsu, timer, diary window, later) -->
    <main class="workspace" id="home">
      <section class="card">
        <h2 class="card-title">Workspace</h2>
        <p class="card-note">Kitsu, the timer and the diary window will live here.</p>
        <button class="btn" type="button">Sample button</button>
      </section>
    </main>

    <!-- RIGHT SIDEBAR (clock + quote, later) -->
    <aside class="sidebar sidebar-right" id="right">
      <section class="card">
        <h2 class="card-title">Clock</h2>
        <p class="clock-placeholder">00:00:00</p>
      </section>
      <section class="card">
        <h2 class="card-title">Quote</h2>
        <p class="card-note">Coming soon</p>
      </section>
    </aside>

  </div>
  <script src="script.js"></script>
</body>
</html>
